version: 1
project:
  name: athena-api
  description: Rails API readiness slice for local development, CI-style verification, PostgreSQL-backed runtime, and production image build
  type: application
metadata:
  ota:
    minimum_version: "1.6.24"
execution:
  default_context: host
  contexts:
    host:
      backend: native
      only_on:
        - linux
        - macos
        - windows
    ruby-host:
      extends: host
      only_on:
        - linux
        - macos
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: ruby:3.3.11-bookworm
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - .bundle
          - vendor/bundle
          - log
          - tmp
          - storage
    docker-host:
      backend: native
toolchains:
  ruby:
    version: "3.3.11"
    package_managers:
      bundler: "2.5.3"
    fulfillment:
      source: ruby
      mode: run
native_prerequisites:
  ruby-native-gem-build-tools:
    description: Native build tools and PostgreSQL headers needed by Bundler gems such as pg and nokogiri on Linux and macOS
    platforms:
      linux:
        check: ruby-native-gem-build-tools-linux
        apt:
          - build-essential
          - libpq-dev
          - pkg-config
      macos:
        check: ruby-native-gem-build-tools-macos
        brew:
          - libpq
          - pkg-config
        xcode_clt: true
env:
  vars:
    RAILS_ENV:
      default: development
    DB_USERNAME:
      default: postgres
    DB_PASSWORD:
      default: ci-postgres-password
    DB_HOST:
      default: localhost
    DB_PORT:
      default: "5432"
    BUNDLE_PATH:
      default: vendor/bundle
    ALLOWED_ORIGINS:
      default: http://localhost:8081
    SECRET_KEY_BASE:
      secret: true
      required: false
    TTS_SERVER_URL:
      default: http://localhost:8000
    TTS_SECRET_KEY:
      secret: true
      required: false
  sources:
    - kind: dotenv
      path: .env
surfaces:
  api:
    kind: http
    port: 3000
    path: /up
    readiness:
      kind: http
      method: GET
      path: /up
      success:
        status:
          - 200
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
services:
  postgres:
    required: true
    manager:
      kind: host
    endpoints:
      host:
        address: 127.0.0.1
        port: 5432
    readiness:
      from: host
      kind: tcp
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
tasks:
  setup:env:
    context: host
    description: Create the local Rails env file with development defaults when missing
    notes: |
      README references `.env.example`, but this repository does not currently commit one.
      This task uses Ota's first-class env bootstrap so `.env` is created idempotently without shell glue.
    category: setup
    action:
      kind: ensure_env_file
      path: .env
      vars:
        DB_USERNAME:
          value: postgres
        DB_PASSWORD:
          value: ci-postgres-password
        DB_HOST:
          value: localhost
        DB_PORT:
          value: "5432"
        RAILS_ENV:
          value: development
        ALLOWED_ORIGINS:
          value: http://localhost:8081
        SECRET_KEY_BASE:
          random:
            bytes: 64
            encoding: hex
        TTS_SERVER_URL:
          value: http://localhost:8000
        TTS_SECRET_KEY:
          random:
            bytes: 32
            encoding: hex
    effects:
      writes:
        - .env
    internal: true
  install:
    context: ruby-host
    description: Install Ruby dependencies with Bundler into a repo-local bundle path
    notes: |
      This follows the README `bundle install` step while keeping dependency hydration under
      repo-local ignored paths so the write boundary is explicit.
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: bundler
        cwd: .
        path: vendor/bundle
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - ruby
      any_of:
        - label: native-ruby-build-tools
          when:
            context: ruby-host
          native:
            - ruby-native-gem-build-tools
    effects:
      writes:
        - .bundle
        - vendor/bundle
      network: true
      network_kind: dependency_hydration
    safe_for_agent: true
  db:prepare:
    context: ruby-host
    description: Prepare the Rails development database and Solid Queue schema
    notes: |
      This maps to the README database setup path: Rails database preparation plus the Solid Queue schema load.
    category: setup
    run: bundle exec rails db:prepare && bundle exec rails runner "load Rails.root.join('db/queue_schema.rb')"
    depends_on:
      - install
      - setup:env
    requires_services:
      - postgres
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - log
        - tmp
        - storage
      network: true
      network_kind: integration_test
      external_state:
        - postgres
    internal: true
  lint:
    context: ruby-host
    description: Run the repository RuboCop surface
    notes: |
      This maps to the GitHub Actions lint job and uses the repo binstub.
    category: test
    command:
      exe: bin/rubocop
      args:
        - -f
        - github
    execution:
      default_mode: native
      modes:
        container:
          context: app
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    depends_on:
      - install
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - tmp
    safe_for_agent: true
  security:brakeman:
    context: ruby-host
    description: Run Brakeman Rails security analysis
    notes: |
      This maps to the GitHub Actions security scan using the repository ignore config.
    category: test
    command:
      exe: bin/brakeman
      args:
        - --no-pager
        - --ignore-config
        - config/brakeman.ignore
    execution:
      default_mode: native
      modes:
        container:
          context: app
    depends_on:
      - install
    requirements:
      toolchains:
        - ruby
    safe_for_agent: true
  security:audit:
    context: ruby-host
    description: Run Bundler Audit against the locked gem set
    notes: |
      This maps to the GitHub Actions vulnerable-gem scan and uses the repo wrapper so
      the audit config stays contract-owned instead of bypassed by a raw gem entrypoint.
    category: test
    command:
      exe: bin/bundler-audit
    execution:
      default_mode: native
      modes:
        native:
          context: ruby-host
        container:
          context: app
    depends_on:
      - install
    requirements:
      toolchains:
        - ruby
    effects:
      network: true
    safe_for_agent: true
  test:
    context: ruby-host
    description: Run the RSpec suite against local PostgreSQL
    notes: |
      This maps to the GitHub Actions test job, which migrates PostgreSQL and runs `bundle exec rspec`.
      The task injects the same test database environment instead of depending on local `.env` edits.
    category: test
    run: bundle exec rails db:migrate && bundle exec rspec
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:ci-postgres-password@localhost:5432
      DB_USERNAME: postgres
      DB_PASSWORD: ci-postgres-password
      DB_HOST: localhost
      DB_PORT: "5432"
      SECRET_KEY_BASE: a_very_long_test_secret_key_that_is_at_least_64_characters_long_for_ci
    depends_on:
      - install
    requires_services:
      - postgres
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - log
        - tmp
        - storage
        - spec
      network: true
      network_kind: integration_test
      external_state:
        - postgres
  proof:postgres-unavailable:
    context: ruby-host
    description: Prove the Rails database seam fails when the declared PostgreSQL endpoint is unavailable
    notes: |
      This is an explicit V11.11 negative control for the app runtime proof. It uses the same
      Rails database connection path as the application but redirects only this finite control
      to an unreachable loopback port. It writes Ota's transaction-bound failure attestation only
      after Rails reports that PostgreSQL is unavailable; any other non-zero exit remains invalid
      control evidence. This task is intentionally outside the normal app workflow closure.
    category: test
    command:
      exe: bundle
      args:
        - exec
        - rails
        - runner
        - 'require "json"; transaction_id = ENV.fetch("OTA_PROOF_TRANSACTION_ID"); control_id = ENV.fetch("OTA_PROOF_NEGATIVE_CONTROL_ID"); obligation_id = ENV.fetch("OTA_PROOF_NEGATIVE_CONTROL_OBLIGATION"); attestation_path = ENV.fetch("OTA_PROOF_NEGATIVE_CONTROL_ATTESTATION_FILE"); begin; ActiveRecord::Base.connection.execute("SELECT 1"); raise "Ota negative control unexpectedly reached PostgreSQL"; rescue StandardError => error; unavailable = error.is_a?(ActiveRecord::ConnectionNotEstablished) || (defined?(PG::ConnectionBad) && error.is_a?(PG::ConnectionBad)); raise unless unavailable; File.write(attestation_path, JSON.generate({transaction_id: transaction_id, control_id: control_id, obligation_id: obligation_id, failure_kind: "dependency_unavailable"})); warn(error.message); exit 1; end'
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:ci-postgres-password@127.0.0.1:1/athena_api_test
      DB_USERNAME: postgres
      DB_PASSWORD: ci-postgres-password
      DB_HOST: 127.0.0.1
      DB_PORT: "1"
      SECRET_KEY_BASE: a_very_long_test_secret_key_that_is_at_least_64_characters_long_for_ci
    depends_on:
      - install
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - log
        - tmp
      network: true
      network_kind: integration_test
      external_state:
        - postgres
  proof:postgres-marker:
    context: ruby-host
    description: Write the runner-issued PostgreSQL seam marker before runtime proof
    notes: |
      This is proof-only setup for the `app-proof` workflow. Ota injects an opaque marker for
      each proof transaction; this task writes that exact marker through Rails so the separate
      post-readiness observer can prove the declared PostgreSQL seam was exercised.
    category: setup
    command:
      exe: bundle
      args:
        - exec
        - rails
        - runner
        - 'marker = ENV.fetch("OTA_PROOF_POSTGRES_MARKER"); connection = ActiveRecord::Base.connection; connection.execute("CREATE TABLE IF NOT EXISTS ota_proof_markers (marker text PRIMARY KEY)"); connection.execute("INSERT INTO ota_proof_markers (marker) VALUES (#{connection.quote(marker)}) ON CONFLICT (marker) DO NOTHING")'
    depends_on:
      - db:prepare
    requires_services:
      - postgres
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - log
        - tmp
      network: true
      network_kind: integration_test
      external_state:
        - postgres
    internal: true
  proof:postgres-marker-observe:
    context: ruby-host
    description: Confirm the runner-issued marker is visible through the PostgreSQL seam
    notes: |
      This finite observer is intentionally outside the normal `app-proof` workflow closure.
      Ota does not give this task the opaque marker. It must recover the marker from PostgreSQL,
      then write the runner-owned transaction attestation before teardown. Its ensure block drops
      the proof-only table even when marker observation fails.
    category: test
    command:
      exe: bundle
      args:
        - exec
        - rails
        - runner
        - 'require "json"; transaction_id = ENV.fetch("OTA_PROOF_TRANSACTION_ID"); observation_id = ENV.fetch("OTA_PROOF_OBSERVATION_ID"); attestation_path = ENV.fetch("OTA_PROOF_ATTESTATION_FILE"); connection = ActiveRecord::Base.connection; begin; observed = connection.select_value("SELECT marker FROM ota_proof_markers ORDER BY marker LIMIT 1"); raise "Ota proof marker was not observed through PostgreSQL" if observed.nil? || observed.empty?; File.write(attestation_path, JSON.generate({transaction_id: transaction_id, observation_id: observation_id, marker: observed})); ensure; connection.execute("DROP TABLE IF EXISTS ota_proof_markers"); end'
    depends_on:
      - db:prepare
    requires_services:
      - postgres
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - log
        - tmp
      network: true
      network_kind: integration_test
      external_state:
        - postgres
  verify:static:
    description: Run the bounded static verification path without database mutation
    notes: |
      This is the safe agent-facing verification lane for normal code review and content changes.
      It keeps Bundler hydration explicit but avoids the PostgreSQL-mutating RSpec path.
    category: test
    aggregate:
      tasks:
        - lint
        - security:brakeman
        - security:audit
    safe_for_agent: true
  verify:
    description: Run the default verification path for agent and CI-style checks
    notes: |
      This is the Ota entrypoint for normal validation before opening or reviewing a change.
    category: test
    aggregate:
      tasks:
        - lint
        - security:brakeman
        - security:audit
        - test
  dev:
    context: ruby-host
    description: Start the Rails API server
    notes: |
      This follows the README local development path and exposes the Rails health endpoint at `/up`.
    category: dev
    launch:
      kind: command
      exe: bundle
      args:
        - exec
        - rails
        - server
      runtime_projection:
        listener: api
        adapter: rails
    depends_on:
      - db:prepare
    requires_services:
      - postgres
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - log
        - tmp
        - storage
      external_state:
        - postgres
    runtime:
      kind: service
      surfaces:
        api:
          project:
            host:
              primary: true
  worker:
    context: ruby-host
    description: Start the Solid Queue worker
    notes: |
      Use this in a second terminal when testing asynchronous audio synthesis jobs locally.
    category: dev
    launch:
      kind: command
      exe: bundle
      args:
        - exec
        - rails
        - solid_queue:start
    depends_on:
      - db:prepare
    requires_services:
      - postgres
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - log
        - tmp
      external_state:
        - postgres
  docker:build:
    context: docker-host
    description: Build the production Rails image from the repository Dockerfile
    notes: |
      The Dockerfile is documented as production-oriented, not a local development container path.
      This task proves image build planning without claiming compose or devcontainer support.
    category: build
    action:
      kind: build_container_image
      file: Dockerfile
      context: .
      tag: athena-api:ota
    requirements:
      tools:
        docker: "*"
    effects:
      network: true
      external_state:
        - docker
workflows:
  default: app
  verify:
    intent: ci_verification
    description: CI-style verification path for lint, security scans, and RSpec
    setup:
      task: install
    run:
      task: verify
  verify-static:
    intent: ci_verification
    description: Bounded host verification path for static checks when local PostgreSQL runtime proof is intentionally out of scope
    setup:
      task: install
    run:
      task: verify:static
  app:
    intent: local_development
    description: Rails API development workflow with local PostgreSQL
    prepare:
      task: setup:env
    setup:
      task: db:prepare
    run:
      task: dev
    readiness:
      surfaces:
        - api
    exposes:
      - surface: api
  app-proof:
    intent: local_development
    description: Rails API runtime proof with a marker-bound PostgreSQL seam observation
    prepare:
      task: setup:env
    setup:
      task: proof:postgres-marker
    run:
      task: dev
    readiness:
      surfaces:
        - api
    proof:
      seam_observations:
        - id: postgres-marker
          dependency: postgres
          producer_task: proof:postgres-marker
          task: proof:postgres-marker-observe
          marker_env: OTA_PROOF_POSTGRES_MARKER
      negative_controls:
        - id: postgres-unavailable
          dependency: postgres
          obligation: postgres-marker
          task: proof:postgres-unavailable
          intervention:
            kind: dependency_endpoint_override
          expected_failure: dependency_unavailable
    exposes:
      - surface: api
  worker:
    intent: local_development
    description: Solid Queue worker workflow for async jobs
    prepare:
      task: setup:env
    setup:
      task: db:prepare
    run:
      task: worker
  image:
    intent: packaged_runtime
    description: Production Docker image build workflow
    run:
      task: docker:build
checks:
  - name: ruby-native-gem-build-tools-linux
    kind: precondition
    severity: error
    run: sh -c "cc --version && pg_config --version && pkg-config --version"
  - name: ruby-native-gem-build-tools-macos
    kind: precondition
    severity: error
    run: sh -c "xcode-select -p && pg_config --version && pkg-config --version"
agent:
  posture: readiness_strict
  entrypoint: install
  default_task: verify:static
  safe_tasks:
    - install
    - lint
    - security:brakeman
    - security:audit
    - verify:static
  refusal_canaries:
    - task: verify
    - workflow: app
  verify_after_changes:
    - verify:static
  writable_paths:
    - app
    - db
    - lib
    - public
    - spec
    - test
    - log
    - tmp
    - storage
    - vendor/bundle
    - .bundle
  protected_paths:
    - .github/workflows
    - .ruby-version
    - Gemfile
    - Gemfile.lock
    - Dockerfile
    - .dockerignore
    - .env
    - config/credentials.yml.enc
    - config/database.yml
    - config/storage.yml
    - config/queue.yml
    - config/puma.rb
    - ota.yaml
  bootstrap:
    ota:
      note: Install ota when missing so contributors and agents can run the readiness workflows declared in this contract.
      source:
        kind: branch
        branch: 1.6.25-implementation
  notes: |
    This contract intentionally scopes Athena API to the repo-visible Rails API surfaces:
    Bundler setup, PostgreSQL-backed development, CI-style lint/security/test checks, Solid Queue worker startup,
    and the documented production Docker image build.
    This active pressure branch tracks Ota 1.6.25 implementation work through the canonical
    bootstrap source so CI and contract execution test the same unreleased binary.
    Use `ota tasks --safe --use` before running agent work to see the approved safe task surface.
    Use `ota run verify:static` after normal code changes; it is the default agent verification path.
    Use `ota run verify` when you intentionally want the full PostgreSQL-backed CI-style validation path.
    `verify` and the `app` workflow are refusal canaries: `ota run --agent --expect-refusal verify`
    and `ota up --agent --expect-refusal --workflow app` must remain blocked by the agent-safety closure.
    Use `ota up --workflow app` for the local API runtime and `ota up --workflow worker` for Solid Queue.
    Do not edit `.env` directly through agent-safe tasks; `setup:env` creates it idempotently when a local runtime path needs it.
