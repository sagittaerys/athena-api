name: "Test: Ota contract matrix"

on:
  workflow_dispatch:
    inputs:
      ota_source:
        description: Ota install source selector (`contract`, released version like `v1.6.25`, exact git rev, or branch with `ota_git_branch`)
        required: false
        default: contract
      ota_git_branch:
        description: Optional Ota git branch when `ota_source` should install unreleased pressure truth from git
        required: false
        default: ""
  pull_request:
    paths:
      - "ota.yaml"
      - ".github/workflows/test-ota-contract-matrix.yml"
  push:
    paths:
      - "ota.yaml"
      - ".github/workflows/test-ota-contract-matrix.yml"

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: "1"
  OTA_SOURCE: ${{ github.event.inputs.ota_source || 'contract' }}
  OTA_GIT_BRANCH: ${{ github.event.inputs.ota_git_branch || '' }}

jobs:
  native-ubuntu:
    name: Ota Contract Matrix (ubuntu-full)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OTA_ARTIFACT_DIR: tmp/ota-contract-matrix
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare Ota matrix artifacts
        shell: bash
        run: mkdir -p "$OTA_ARTIFACT_DIR"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          bundler-cache: false

      - name: Install native prerequisite packages
        shell: bash
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential libpq-dev pkg-config

      - name: Install declared Ruby toolchain
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: 2.5.3

      - name: Install ota from contract
        if: env.OTA_SOURCE == 'contract'
        uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f # v1.0.9
        with:
          source: contract
          contract-path: ota.yaml

      - name: Install ota from released version (Unix)
        if: env.OTA_SOURCE != 'contract' && env.OTA_GIT_BRANCH == '' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION="${OTA_SOURCE}" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota from released version (Windows)
        if: env.OTA_SOURCE != 'contract' && env.OTA_GIT_BRANCH == '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_VERSION = "${env:OTA_SOURCE}"
          irm https://dist.ota.run/install.ps1 | iex
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install ota from git branch (Unix)
        if: env.OTA_GIT_BRANCH != '' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_BRANCH="${OTA_GIT_BRANCH}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota from git branch (Windows)
        if: env.OTA_GIT_BRANCH != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_GIT_BRANCH = "${env:OTA_GIT_BRANCH}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Assert ota minimum version from contract
        shell: bash
        run: |
          ota --version | tee "$OTA_ARTIFACT_DIR/ota-version.txt"
          required="$(awk -F'\"' '/minimum_version:/{print $2; exit}' ota.yaml)"
          if [ -z "$required" ]; then
            echo "missing metadata.ota.minimum_version in ota.yaml"
            exit 1
          fi
          python3 - "$required" "$(cat "$OTA_ARTIFACT_DIR/ota-version.txt")" <<'PY'
          import re
          import sys

          required = sys.argv[1]
          version_line = sys.argv[2]
          match = re.search(r"v(\d+\.\d+\.\d+)", version_line)
          if not match:
              print(f"unable to parse ota version from: {version_line}", file=sys.stderr)
              raise SystemExit(1)

          current = tuple(int(part) for part in match.group(1).split("."))
          minimum = tuple(int(part) for part in required.split("."))
          if current < minimum:
              print(
                  f"installed ota {match.group(1)} does not satisfy minimum_version {required}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Validate contract
        shell: bash
        run: |
          ota validate --json . > "$OTA_ARTIFACT_DIR/ota-validate.json"
          ota validate .

      - name: Doctor verify workflow
        shell: bash
        run: ota doctor --workflow verify .

      - name: List task surfaces
        shell: bash
        run: |
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --unsafe --use .

      - name: Prove agent governance admission and refusal reconciliation
        shell: bash
        run: |
          ota tasks --use --json . > "$OTA_ARTIFACT_DIR/ota-tasks.json"
          jq -e '
            .tasks[]
            | select(.name == "verify:static")
            | .use.agent.callable == true
            and .use.agent.command == "ota run verify:static --agent"
          ' "$OTA_ARTIFACT_DIR/ota-tasks.json"

          ota run verify:static --agent --dry-run --json . > "$OTA_ARTIFACT_DIR/ota-agent-safe-preview.json"
          jq -e '
            .ok == true
            and .governance.evaluation.preflight.state == "allowed"
            and .governance.evaluation.preflight.replay.status == "satisfied"
            and .governance.evaluation.post_execution.state == "not_run"
            and .governance.evaluation.post_execution.refusal_occurred == false
          ' "$OTA_ARTIFACT_DIR/ota-agent-safe-preview.json"

          set +e
          ota run verify --agent --dry-run --json . > "$OTA_ARTIFACT_DIR/ota-agent-refusal-preview.json"
          refusal_status=$?
          set -e
          test "$refusal_status" -eq 1
          jq -e '
            .ok == false
            and .governance.evaluation.preflight.state == "refused"
            and .governance.evaluation.preflight.refusal_reason_family == "requested_task_not_safe"
            and .governance.evaluation.preflight.decision_basis[0].id == "refusal:requested_task_not_safe"
            and .governance.evaluation.preflight.replay.status == "satisfied"
            and .governance.evaluation.post_execution.state == "not_run"
            and .governance.evaluation.post_execution.execution_attempted == false
            and .governance.evaluation.post_execution.refusal_occurred == true
            and .governance.evaluation.post_execution.refusal.reason_family == "requested_task_not_safe"
            and .governance.evaluation.post_execution.not_run_reason == "preflight_refusal"
            and .governance.evaluation.post_execution.replay.status == "satisfied"
          ' "$OTA_ARTIFACT_DIR/ota-agent-refusal-preview.json"

      - name: Prove task and workflow refusal canaries
        shell: bash
        run: |
          ota run --agent --expect-refusal --json verify . > "$OTA_ARTIFACT_DIR/ota-task-refusal-canary.json"
          jq -e '
            .ok == true
            and .status == "refused_as_expected"
            and .canary.kind == "task"
            and .canary.target == "verify"
            and .canary.execution_started == false
            and .canary.refusal.reason_family == "requested_task_not_safe"
            and .receipt.ok == false
          ' "$OTA_ARTIFACT_DIR/ota-task-refusal-canary.json"

          ota up --agent --expect-refusal --workflow app --json . > "$OTA_ARTIFACT_DIR/ota-workflow-refusal-canary.json"
          jq -e '
            .ok == true
            and .status == "refused_as_expected"
            and .canary.kind == "workflow"
            and .canary.target == "app"
            and .canary.execution_started == false
            and .canary.refusal.reason_family == "requested_task_not_safe"
            and .receipt.ok == false
          ' "$OTA_ARTIFACT_DIR/ota-workflow-refusal-canary.json"

      - name: List workflows
        shell: bash
        run: ota workflows .

      - name: Export execution topology
        shell: bash
        run: ota execution topology --json . > "$OTA_ARTIFACT_DIR/ota-execution-topology.json"

      - name: Dry-run verify workflow
        shell: bash
        run: ota up --workflow verify --native --dry-run .

      - name: Dry-run app workflow
        shell: bash
        run: ota up --workflow app --native --dry-run .

      - name: Dry-run marker-bound app proof workflow
        shell: bash
        run: ota up --workflow app-proof --native --dry-run .

      - name: Execute verify workflow
        timeout-minutes: 90
        shell: bash
        run: ota up --workflow verify --native --stream .

      - name: Prove app workflow
        timeout-minutes: 60
        shell: bash
        run: ota proof runtime --workflow app --native --json . > "$OTA_ARTIFACT_DIR/ota-proof-app.json"

      - name: Prove marker-bound and fault-tested PostgreSQL seam
        timeout-minutes: 60
        shell: bash
        run: |
          ota proof runtime --workflow app-proof --negative-control postgres-unavailable --native --json --archive . > "$OTA_ARTIFACT_DIR/ota-proof-app-seam.json"
          jq -e '
            .seam_observations[0] as $seam_observation
            | .negative_control as $canonical_negative_control
            | $canonical_negative_control.failure_attestation_digest as $canonical_failure_attestation_digest
            | .ok == true
            and .proof_verdict == "passed_with_unproven_boundaries"
            and (.seam_observations | length) == 1
            and .seam_observations[0].outcome == "observed"
            and (.seam_observations[0].transaction_id | startswith("sha256:"))
            and (.seam_observations[0].attestation_digest | startswith("sha256:"))
            and (.dependency_evidence | any(
              .dependency_id == "service:postgres"
              and .level == "fault_tested"
              and .proof_obligation_id == $canonical_negative_control.obligation_id
              and .observation.origin == "round_trip_effect"
              and .observation.evidence_class == "attested"
              and .negative_control.status == "validated"
              and .negative_control.same_obligation == true
              and .negative_control.failure_mode == "expected_missing_effect"
              and (.negative_control.failure_attestation_digest | startswith("sha256:"))
              and .negative_control.failure_attestation_digest == $canonical_failure_attestation_digest
            ))
            and .negative_control.status == "validated"
            and .negative_control.outcome == "expected_obligation_failed"
            and .negative_control.intervention.kind == "dependency_endpoint_override"
            and .negative_control.failure_mode == "expected_missing_effect"
            and .negative_control.obligation_id == "postgres-marker"
            and .negative_control.obligation_id == $seam_observation.id
            and .negative_control.transaction_id == $seam_observation.transaction_id
            and (.negative_control.failure_attestation_digest | startswith("sha256:"))
            and ([.not_proved[]? | select(
              .kind == "dependency_exercise_not_proved"
              and .dependency_id == "service:postgres"
            )] | length) == 0
            and ([.not_proved[]? | select(
              .kind == "dependency_causality_not_proved"
              and .dependency_id == "service:postgres"
            )] | length) == 0
            and ([.not_proved[]? | select(
              .kind == "dependency_output_shaping_not_proved"
              and .dependency_id == "service:postgres"
              and .proof_obligation_id == "postgres-marker"
              and .reason == "causal_evidence_scoped_to_declared_seam_obligation"
            )] | length) == 1
            and ([.not_proved[]?.kind] | sort) == [
              "broader_repo_completion_not_proved",
              "dependency_output_shaping_not_proved",
              "external_network_path_not_proved"
            ]
          ' "$OTA_ARTIFACT_DIR/ota-proof-app-seam.json"

      - name: Assert proof left declared source unchanged
        shell: bash
        run: |
          git status --porcelain=v1 > "$OTA_ARTIFACT_DIR/ota-proof-source-status.txt"
          if [ -s "$OTA_ARTIFACT_DIR/ota-proof-source-status.txt" ]; then
            echo "Runtime proof changed tracked or unignored source after its archive was recorded:" >&2
            cat "$OTA_ARTIFACT_DIR/ota-proof-source-status.txt" >&2
            exit 1
          fi

      - name: Assert archived proof supports declared proof breadth
        shell: bash
        run: |
          # The proof task has ended, so Doctor correctly reports the stopped runtime surface.
          # The claim assurance remains independently consumable from its JSON output.
          set +e
          ota doctor --json . > "$OTA_ARTIFACT_DIR/ota-doctor-proof-claim.json"
          doctor_status=$?
          set -e
          if [ "$doctor_status" -ne 1 ]; then
            echo "expected Doctor to report the stopped proof runtime as not ready, got exit $doctor_status" >&2
            exit 1
          fi
          jq -e '
            .summary.primary_blocker.code == "OTA_WORKFLOW_SURFACE_READINESS_FAILED"
            and (
              .claim_assurance
              | any(
                .subject.kind == "workflow"
                and .subject.name == "app-proof"
                and .family == "proof_breadth"
                and .assurance.status == "supported"
                and (.assurance.coverage | index("immutable_proof_archive") != null)
                and (.assurance.evidence | any(
                  .source == ".ota/proof/archives"
                  and .evidence_class == "attested"
                ))
              )
            )
          ' "$OTA_ARTIFACT_DIR/ota-doctor-proof-claim.json"

      - name: Upload app proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-ubuntu-full
          path: |
            ${{ env.OTA_ARTIFACT_DIR }}
            .ota/proof/app/topology.json
            .ota/proof/app/doctor.json
            .ota/proof/app/up.log
            .ota/proof/app-proof/topology.json
            .ota/proof/app-proof/doctor.json
            .ota/proof/app-proof/up.log

  native-macos:
    name: Ota Contract Matrix (macos-full)
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          bundler-cache: false

      - name: Install native prerequisite packages
        shell: bash
        run: |
          brew untap aws/tap || true
          brew install postgresql@16 pkg-config
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
          brew services start postgresql@16
          for _ in $(seq 1 30); do
            if pg_isready -h localhost -p 5432; then
              break
            fi
            sleep 2
          done
          createuser -s postgres || true
          psql postgres -c "ALTER USER postgres WITH PASSWORD 'ci-postgres-password';"

      - name: Install declared Ruby toolchain
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: 2.5.3

      - name: Install ota from contract
        if: env.OTA_SOURCE == 'contract'
        uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f # v1.0.9
        with:
          source: contract
          contract-path: ota.yaml

      - name: Install ota from released version (Unix)
        if: env.OTA_SOURCE != 'contract' && env.OTA_GIT_BRANCH == '' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION="${OTA_SOURCE}" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota from released version (Windows)
        if: env.OTA_SOURCE != 'contract' && env.OTA_GIT_BRANCH == '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_VERSION = "${env:OTA_SOURCE}"
          irm https://dist.ota.run/install.ps1 | iex
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install ota from git branch (Unix)
        if: env.OTA_GIT_BRANCH != '' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_BRANCH="${OTA_GIT_BRANCH}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota from git branch (Windows)
        if: env.OTA_GIT_BRANCH != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_GIT_BRANCH = "${env:OTA_GIT_BRANCH}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate contract
        shell: bash
        run: ota validate .

      - name: Doctor verify workflow
        shell: bash
        run: ota doctor --workflow verify .

      - name: Dry-run verify workflow
        shell: bash
        run: ota up --workflow verify --native --dry-run .

      - name: Dry-run app workflow
        shell: bash
        run: ota up --workflow app --native --dry-run .

      - name: Execute verify workflow
        timeout-minutes: 90
        shell: bash
        run: ota up --workflow verify --native --stream .

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-macos-full
          path: |
            .ota/proof

  native-windows:
    name: Ota Contract Matrix (windows-static)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          bundler-cache: false

      - name: Install ota from contract
        if: env.OTA_SOURCE == 'contract'
        uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f # v1.0.9
        with:
          source: contract
          contract-path: ota.yaml

      - name: Install ota from released version (Unix)
        if: env.OTA_SOURCE != 'contract' && env.OTA_GIT_BRANCH == '' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION="${OTA_SOURCE}" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota from released version (Windows)
        if: env.OTA_SOURCE != 'contract' && env.OTA_GIT_BRANCH == '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_VERSION = "${env:OTA_SOURCE}"
          irm https://dist.ota.run/install.ps1 | iex
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install ota from git branch (Unix)
        if: env.OTA_GIT_BRANCH != '' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_BRANCH="${OTA_GIT_BRANCH}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota from git branch (Windows)
        if: env.OTA_GIT_BRANCH != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_GIT_BRANCH = "${env:OTA_GIT_BRANCH}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate contract
        shell: powershell
        run: ota validate .

      - name: Assert doctor reports native static workflow unavailable on Windows
        shell: powershell
        run: |
          $doctorOutput = & ota doctor --workflow verify-static --json .
          $doctorExitCode = $LASTEXITCODE
          if ($doctorExitCode -eq 0) {
            throw "verify-static must be reported unavailable through the Linux/macOS ruby-host context on Windows"
          }
          $doctor = $doctorOutput | ConvertFrom-Json
          $platformFinding = @($doctor.findings | Where-Object { $_.summary -like "Unsupported host platform*" })
          if ($platformFinding.Count -eq 0) {
            throw "expected host-platform refusal in doctor findings"
          }
          exit 0

      - name: Assert native static workflow is refused on Windows
        shell: powershell
        run: |
          $previewOutput = & ota up --workflow verify-static --native --dry-run --json .
          $previewExitCode = $LASTEXITCODE
          if ($previewExitCode -eq 0) {
            throw "verify-static must be unavailable through the Linux/macOS ruby-host context on Windows"
          }
          $preview = $previewOutput | ConvertFrom-Json
          if ($preview.summary.primary_blocker.summary -notlike "Unsupported host platform*") {
            throw "expected host-platform refusal, got: $($preview.summary.primary_blocker.summary)"
          }
          exit 0

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-windows-static
          path: |
            .ota/proof

  container-ubuntu:
    name: Ota Contract Matrix (ubuntu-container)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install ota from contract
        if: env.OTA_SOURCE == 'contract'
        uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f # v1.0.9
        with:
          source: contract
          contract-path: ota.yaml

      - name: Install ota from released version (Unix)
        if: env.OTA_SOURCE != 'contract' && env.OTA_GIT_BRANCH == '' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION="${OTA_SOURCE}" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota from released version (Windows)
        if: env.OTA_SOURCE != 'contract' && env.OTA_GIT_BRANCH == '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_VERSION = "${env:OTA_SOURCE}"
          irm https://dist.ota.run/install.ps1 | iex
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install ota from git branch (Unix)
        if: env.OTA_GIT_BRANCH != '' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_BRANCH="${OTA_GIT_BRANCH}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota from git branch (Windows)
        if: env.OTA_GIT_BRANCH != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_GIT_BRANCH = "${env:OTA_GIT_BRANCH}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate contract
        shell: bash
        run: ota validate .

      - name: Doctor static verify workflow (container)
        shell: bash
        run: ota doctor --mode container --workflow verify-static .

      - name: Dry-run container install
        shell: bash
        run: ota run install --mode container --dry-run .

      - name: Dry-run container lint
        shell: bash
        run: ota run lint --mode container --dry-run .

      - name: Execute container lint
        timeout-minutes: 60
        shell: bash
        run: ota run lint --mode container --stream .

      - name: Execute container security scan
        timeout-minutes: 60
        shell: bash
        run: ota run security:brakeman --mode container --stream .

      - name: Execute container audit
        timeout-minutes: 60
        shell: bash
        run: |
          if ! ota run security:audit --mode container --stream .; then
            echo "::warning title=Container audit is advisory in athena-api::security:audit uses the live ruby-advisory-db feed and can fail on newly published advisories even when the container execution surface itself is healthy. The matrix still proves the contract, hydration, dry-run, and other real container task lanes."
          fi

      - name: Build the production Docker image through Ota
        timeout-minutes: 60
        shell: bash
        run: ota up --workflow image --stream .

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-ubuntu-container
          path: |
            .ota/proof
