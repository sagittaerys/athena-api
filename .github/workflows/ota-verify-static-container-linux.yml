# ota:managed-github-projection v1 identity=sha256:6650da418be90230c98c58cfea6b2bb83cdcd0fc257327a5107f6dd75382d6c5
name: Ota governance ('verify-static')

on:
  workflow_call:
    inputs:
      ota_projection_identity:
        description: Ota-managed projection identity
        required: true
        type: string
      ota_runner:
        description: GitHub runner selected by the human-owned caller
        required: false
        default: 'ubuntu-latest'
        type: string
      ota_target_os:
        description: Target operating system bound into the Ota projection
        required: true
        type: string

jobs:
  ota_ota_verify_verify_static:
    name: 'ota.verify.verify-static (linux/container)'
    runs-on: ${{ inputs.ota_runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f
        with:
          source: contract
      - name: Verify Ota projection identity
        run: ota ci projection --workflow 'verify-static' --mode container --target-os ${{ inputs.ota_target_os }} --expect-identity ${{ inputs.ota_projection_identity }} --json
      - name: Validate contract
        run: ota validate . --json
      - name: Diagnose contract lane
        run: ota doctor --workflow 'verify-static' --mode container --json
      - name: Discover safe execution surface
        run: ota tasks --safe --use --json
      - name: Preview contract lane
        run: ota up --workflow 'verify-static' --mode container --agent --dry-run --json
      - name: Execute finite contract task
        run: ota run 'verify:static' --mode container --agent
      - name: Archive workflow readiness receipt
        run: ota receipt --workflow 'verify-static' --mode container --archive --json
  ota_ota_refusal_canary_task_verify:
    name: 'ota.refusal-canary.task.verify (linux/container)'
    runs-on: ${{ inputs.ota_runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f
        with:
          source: contract
      - name: Verify Ota projection identity
        run: ota ci projection --workflow 'verify-static' --mode container --target-os ${{ inputs.ota_target_os }} --expect-identity ${{ inputs.ota_projection_identity }} --json
      - name: Prove agent refusal canary
        run: ota run --agent --expect-refusal --mode container --json 'verify'
  ota_ota_refusal_canary_workflow_app:
    name: 'ota.refusal-canary.workflow.app (linux/container)'
    runs-on: ${{ inputs.ota_runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f
        with:
          source: contract
      - name: Verify Ota projection identity
        run: ota ci projection --workflow 'verify-static' --mode container --target-os ${{ inputs.ota_target_os }} --expect-identity ${{ inputs.ota_projection_identity }} --json
      - name: Prove agent refusal canary
        run: ota up --agent --expect-refusal --workflow 'app' --mode container --json
